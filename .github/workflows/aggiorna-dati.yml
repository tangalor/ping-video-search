name: PingTV - Aggiorna Dati

on:
  workflow_dispatch:
    inputs:
      skip_download:
        description: "Salta step 1-3 (download)"
        required: false
        type: boolean
        default: false
  schedule:
    # 22:12 UTC ~= 00:12 in Italia durante ora legale.
    # Aggiorna questo cron in base all'orario desiderato.
    - cron: "12 22 * * *"

jobs:
  aggiorna-dati:
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze sistema (psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp langdetect deep-translator

      - name: Verifica secrets richiesti
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "Secret mancante: SUPABASE_DB_URL"
            exit 1
          fi
          echo "ok SUPABASE_DB_URL e valorizzata"

          if [ -z "${SUPABASE_URL}" ]; then
            echo "Warning: SUPABASE_URL non valorizzata (opzionale per questo workflow)"
          else
            echo "ok SUPABASE_URL e valorizzata"
          fi

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "Warning: SUPABASE_SERVICE_ROLE_KEY non valorizzata (opzionale per questo workflow)"
          else
            echo "ok SUPABASE_SERVICE_ROLE_KEY e valorizzata"
          fi

      - name: Precheck rete Supabase (DNS/TCP 5432)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DB_HOST="$(python -c 'import os; from urllib.parse import urlparse; u=os.environ.get("SUPABASE_DB_URL", ""); print((urlparse(u).hostname or "") if u else "")')"

          if [ -z "${DB_HOST}" ]; then
            echo "::error::Impossibile estrarre host da SUPABASE_DB_URL. Verifica il formato della connection string."
            exit 1
          fi

          echo "Host Supabase rilevato: ${DB_HOST}"

          A_RECORDS="$(getent ahostsv4 "${DB_HOST}" 2>/dev/null | awk '{print $1}' | sort -u | tr '\n' ' ' || true)"
          AAAA_RECORDS="$(getent ahostsv6 "${DB_HOST}" 2>/dev/null | awk '{print $1}' | sort -u | tr '\n' ' ' || true)"

          if [ -n "${A_RECORDS}" ]; then
            echo "DNS A (IPv4): ${A_RECORDS}"
          else
            echo "DNS A (IPv4): nessun record"
          fi

          if [ -n "${AAAA_RECORDS}" ]; then
            echo "DNS AAAA (IPv6): ${AAAA_RECORDS}"
          else
            echo "DNS AAAA (IPv6): nessun record"
          fi

          if [ -z "${A_RECORDS}" ] && [ -z "${AAAA_RECORDS}" ]; then
            echo "::error::Precheck rete fallito: DNS non risolve l'host Supabase."
            echo "::error::Problema strutturale (DNS/host): la pipeline non puo raggiungere il database."
            exit 1
          fi

          TCP_V4_OK=0
          TCP_V6_OK=0

          if nc -4 -z -w 6 "${DB_HOST}" 5432 >/dev/null 2>&1; then
            TCP_V4_OK=1
            echo "TCP IPv4 verso ${DB_HOST}:5432 -> OK"
          else
            echo "TCP IPv4 verso ${DB_HOST}:5432 -> KO"
          fi

          if nc -6 -z -w 6 "${DB_HOST}" 5432 >/dev/null 2>&1; then
            TCP_V6_OK=1
            echo "TCP IPv6 verso ${DB_HOST}:5432 -> OK"
          else
            echo "TCP IPv6 verso ${DB_HOST}:5432 -> KO"
          fi

          if [ "${TCP_V4_OK}" -eq 0 ] && [ "${TCP_V6_OK}" -eq 0 ]; then
            echo "::error::Precheck rete fallito: nessuna connettivita TCP verso Supabase sulla porta 5432 (IPv4 e IPv6 entrambi KO)."
            echo "::error::Problema strutturale di rete lato runner/DNS/path o outage temporaneo del servizio. Riprova piu tardi o verifica reachability da altra rete."
            exit 1
          fi

          echo "ok precheck rete Supabase superato (almeno uno stack IP raggiunge la porta 5432)"

      - name: Prepara cookie yt-dlp (opzionale)
        env:
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
        run: |
          if [ -z "${YTDLP_COOKIES_B64}" ]; then
            echo "Warning: YTDLP_COOKIES_B64 non valorizzata (potrebbero comparire blocchi anti-bot su YouTube)"
          else
            if ! printf '%s' "${YTDLP_COOKIES_B64}" | base64 -d > .yt-dlp-cookies.txt; then
              echo "::error::YTDLP_COOKIES_B64 non valido: decode base64 fallita. Rigenera il valore da un cookies.txt YouTube valido."
              exit 1
            fi
            chmod 600 .yt-dlp-cookies.txt
            echo "ok YTDLP_COOKIES_B64 e valorizzata"
          fi

      - name: Verifica cookie yt-dlp (strutturale + smoke test)
        if: ${{ github.event.inputs.skip_download != 'true' }}
        env:
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
        run: |
          if [ -z "${YTDLP_COOKIES_B64}" ]; then
            echo "::warning::Secret YTDLP_COOKIES_B64 mancante. Il download potrebbe essere bloccato da challenge anti-bot."
            echo "::warning::Per maggiore affidabilita aggiorna YTDLP_COOKIES_B64, oppure usa skip_download=true quando vuoi solo la fase SQL."
            exit 0
          fi

          if [ ! -s .yt-dlp-cookies.txt ]; then
            echo "::error::File cookie yt-dlp assente o vuoto dopo decode. Aggiorna YTDLP_COOKIES_B64."
            exit 1
          fi

          if ! grep -Eqi 'youtube\.com|google\.com|googlevideo\.com|ytimg\.com' .yt-dlp-cookies.txt; then
            echo "::error::Il file cookie decodificato non contiene domini YouTube/Google attesi."
            echo "::error::Esporta di nuovo cookies.txt dal browser (profilo loggato YouTube) e rigenera YTDLP_COOKIES_B64."
            exit 1
          fi

          if ! yt-dlp --cookies .yt-dlp-cookies.txt --extractor-args "youtube:player_client=web" --skip-download --playlist-end 1 "https://www.youtube.com/@pingpongstyles/videos" >/dev/null 2>&1; then
            echo "::warning::Smoke test yt-dlp fallito in precheck (possibile challenge anti-bot temporanea)."
            echo "::warning::Continuo comunque: la verifica definitiva avverra durante l'esecuzione pipeline."
          else
            echo "ok smoke test cookie yt-dlp"
          fi

          echo "ok struttura cookie yt-dlp verificata"

      - name: Rendi eseguibili gli script
        run: |
          chmod +x scripts/aggiorna_dati.sh
          chmod +x scripts/esegui_upsert_chunks_psql.sh

      - name: Esegui pipeline aggiorna_dati
        env:
          SKIP_DOWNLOAD_INPUT: ${{ github.event.inputs.skip_download }}
          DISABLE_PROGRESS_BARS: "1"
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YTDLP_COOKIES_FILE: ./.yt-dlp-cookies.txt
        run: |
          if [ "${SKIP_DOWNLOAD_INPUT}" = "true" ]; then
            ./scripts/aggiorna_dati.sh --skip-download
          else
            ./scripts/aggiorna_dati.sh
          fi

      - name: Cleanup cookie yt-dlp
        if: always()
        run: |
          rm -f .yt-dlp-cookies.txt

      - name: Carica log come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggiorna-dati-logs-${{ github.run_number }}
          path: |
            logs/
            aggiorna_dati_scheduled.log
          if-no-files-found: warn
          retention-days: 14

      - name: Carica output SQL come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggiorna-dati-sql-${{ github.run_number }}
          path: |
            output_upsert_from_csv.sql
            output_upsert_chunks/
          if-no-files-found: warn
          retention-days: 14
