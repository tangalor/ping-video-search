<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reindirizzamento...</title>
  <script>
    (function () {
      var path = window.location.pathname || "/";
      var search = window.location.search || "";
      var hash = window.location.hash || "";

      var segments = path.split("/").filter(Boolean);
      var repoBase = segments.length > 0 ? "/" + segments[0] + "/" : "/";
      var targetPath = path + search + hash;

      try {
        window.sessionStorage.setItem("pingtv.redirectPath", targetPath);
      } catch (error) {
        // Ignore session storage failures and fall back to root navigation.
      }

      var redirectUrl = repoBase + "?p=" + encodeURIComponent(targetPath);
      window.location.replace(redirectUrl);
    })();
  </script>
</head>
<body>
  <p>Reindirizzamento in corso...</p>
</body>
</html>
